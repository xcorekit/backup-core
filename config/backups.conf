Photos|rclone|{LOCAL_BASE}/Photos|{RCLONE_REMOTE}:Sconl/Crate/Media/Photos|
photos-backups|rclone|{LOCAL_BASE}/photos-backups|{RCLONE_REMOTE}:Sconl/Crate/backups/photos-backups|

