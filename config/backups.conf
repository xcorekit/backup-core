# backups.conf
# Generated 2026-08-09 (Claude Code), remapped 2026-08-21 to real Axial/Core/
# Crate destinations (was flat onedrive-sconl:_/<name> staging — that's now
# reserved for genuinely unsorted content only, see _sync below).
#
# Format: name|method|source|dest|options
# {LOCAL_BASE}    -> ~/_ on Linux, ~/Desktop/_ on Windows
# {RCLONE_REMOTE} -> onedrive-sconl
# ─────────────────────────────────────────────────────────────────────────────

## Code Spaces
# Full backup even though it's git-versioned (belt-and-suspenders per Peter).
# Regenerable junk excluded — node_modules/build artifacts/caches, not source.
engineer-systems|rclone|{LOCAL_BASE}/engineer-systems|{RCLONE_REMOTE}:Sconl/Core/Axial/Innovator/Engineer/engineer-systems|--exclude **/node_modules/** --exclude **/.dart_tool/** --exclude **/build/** --exclude **/__pycache__/** --exclude **/.venv/** --exclude **/target/**

## Meta Spaces
# _ace: destination is admin@acexoft.com's own OneDrive (Documents/_ace) -
# a different account, no rclone remote configured for it yet. BLOCKED,
# do not run until that access exists. Left pointing at the old staging
# spot so an accidental run doesn't silently go to the wrong account.
_ace|rclone|{LOCAL_BASE}/_ace|{RCLONE_REMOTE}:_/_ace|# BLOCKED - needs admin@acexoft.com rclone remote, see 21 Aug 2026 note
# _sync: genuinely unsorted/staging content (posters, one-off projects,
# family photos) - stays in the general "_" staging area on purpose, not
# moved into the Axial/Core/Crate structure. Confirmed by Sconl 21 Aug 2026.
_sync|rclone|{LOCAL_BASE}/_sync|{RCLONE_REMOTE}:_/_sync|

## Identity Spaces
Apex|rclone|{LOCAL_BASE}/Apex|{RCLONE_REMOTE}:Sconl/Core/Apex|

